# ------------------------
# Basic Settings
# ------------------------

set -g history-limit 100000

set -g mouse on

set -g default-terminal "tmux-256color"

set -g base-index 1
setw -g pane-base-index 1

set -g escape-time 0
setw -g aggressive-resize on

# ------------------------
# Key Bindings for Pane Navigation & Resizing
# ------------------------

bind-key Left select-pane -L
bind-key Down select-pane -D
bind-key Up select-pane -U
bind-key Right select-pane -R

bind-key -r C-Left resize-pane -L
bind-key -r C-Down resize-pane -D
bind-key -r C-Up resize-pane -U
bind-key -r C-Right resize-pane -R

unbind-key r
bind-key r source-file ~/.tmux.conf \; display-message "Tmux config reloaded."

# ------------------------
# Copy Mode and Clipboard Integration
# ------------------------

# Bind copy mode to prefix + å (or change if you want)
unbind-key å
bind-key å copy-mode

# Copy selection to macOS clipboard with 'y' and show message
bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel "pbcopy" \; display-message "Copied to clipboard"


# ------------------------
# Window Splitting
# ------------------------

bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

# ------------------------
# Status Line Configuration (Your original)
# ------------------------

set -g status on
set -g status-interval 5
set -g status-justify left

set -g status-fg white
set -g status-bg black

setw -g window-status-style 'fg=white,bg=black'
setw -g window-status-current-style 'fg=red,bg=black'


setw -g window-status-current-format '#[bg=green,fg=black,nobold,noitalics,nounderscore]#[bg=green,fg=colour239]#[bg=green,fg=colour239,bold] #W#{?window_zoomed_flag,*Z,} #[bg=black,fg=green,nobold,noitalics,nounderscore]'
setw -g window-status-format '#[bg=colour249,fg=colour252,noitalics]#[bg=colour249,fg=colour237] #I #[bg=colour249,fg=colour239] #W #[bg=colour252,fg=colour249,noitalics]'

set -g status-left "#[bg=colour239,fg=green] #I #[bg=black,fg=colour239,nobold,noitalics,nounderscore]"

set -g status-right-length 150
set -g status-right "#[bg=black,fg=colour237,nobold,noitalics,nounderscore]\
#[bg=colour237,fg=colour255] #[fg=blue]#(gcloud config get-value core/project 2>/dev/null) \
#[fg=colour241]#[fg=green,bg=colour241] #(kubectl config current-context 2>/dev/null)#[fg=white]:#[fg=red]\
#(kubectl config view --minify --output 'jsonpath={..namespace}' 2>/dev/null)"

set -g message-style 'fg=white bg=black'

set -g allow-passthrough on
set -as terminal-features ',tmux-256color:hyperlinks'
set -as terminal-features ',screen-256color:hyperlinks'
set -as terminal-features ',xterm-256color:hyperlinks'
set -ga terminal-overrides ',*:Ms=\E]8;;%p1%s\007%p2%s\E]8;;\007'
